'use strict';
const KEY='mon-training-v2-local';const todayISO=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];const short=['L','M','M','J','V','S','D'];const isoOf=(d)=>{const z=new Date(d);return [z.getFullYear(),String(z.getMonth()+1).padStart(2,'0'),String(z.getDate()).padStart(2,'0')].join('-')};const monday=(d)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return x};const plus=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return isoOf(x)};const idx=d=>(new Date(d+'T12:00:00').getDay()+6)%7;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let view='today',date=todayISO(),openId=null;function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Stockage indisponible : exporte tes données depuis Données.');return false}}const eid=(s,d)=>d+'|'+s;function get(s,d){return data.entries[eid(s,d)]||{}}function set(s,d,patch){data.entries[eid(s,d)]={...get(s,d),...patch};persist()}function all(d){const moved=data.schedule?.[d];return moved?moved.map(id=>sessions.find(s=>s.id===id)).filter(Boolean):sessions.filter(s=>s.day===idx(d))}function header(){return `<div class="hero"><small>MON TRAINING V5.3.3.6 • STOCKAGE LOCAL</small><h1>${view==='today'?'Ta séance du jour':view==='week'?'Planning hebdomadaire':view==='progress'?'Ta progression':view==='lexicon'?'Lexique des exercices':'Sauvegardes & réglages'}</h1><span class="mini">Objectif : physique athlétique • 100 pompes • genou renforcé</span></div>`}function status(s,d){return get(s.id,d).done?' <span class="ok">✓ Terminée</span>':''}function dayButtons(){let m=isoOf(monday(date));return `<div class="days">${DAYS.map((_,i)=>`<button class="${date===plus(m,i)?'active':''}" data-date="${plus(m,i)}">${short[i]}<br>${plus(m,i).slice(8)}</button>`).join('')}</div>`}function renderToday(){return `<div class="row"><button data-shift="-7">‹ Sem.</button><b>${esc(new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'}))}</b><button data-shift="7">Sem. ›</button></div>${dayButtons()}<h2>${DAYS[idx(date)]}</h2>${all(date).map(s=>`<button class="card row" style="width:100%;text-align:left" data-open="${s.id}"><span><b>${esc(s.name)}</b><br><small>${s.optional?'Facultatif · ':''}${s.kind==='strength'?'Charges, répétitions, RPE':s.kind==='pushups'?'Séries et récupération':s.kind==='bike'?'20 minutes':s.kind==='knee'?'Stabilité et renforcement':'Suivi de séance'}</small></span><span>${status(s,date)||'›'}</span></button>`).join('')||'<p>Repos.</p>'}<div class="notice">Douleur persistante au genou ou au bras : réduis la charge et fais évaluer les symptômes. Le WOD remplace une séance, il ne s’ajoute pas à une semaine déjà fatigante.</div>`}function renderWeek(){const m=isoOf(monday(date));return `<div class="row"><button data-shift="-7">‹</button><b>Semaine du ${m.split('-').reverse().join('/')}</b><button data-shift="7">›</button></div>${DAYS.map((n,i)=>{const d=plus(m,i),list=all(d);return `<div class="card"><div class="row"><b>${n} ${d.slice(8)}</b><button data-date="${d}">Ouvrir</button></div>${list.map(s=>`<div class="mini" style="padding:5px 0">${get(s.id,d).done?'✓ ':'○ '}${esc(s.name)}</div>`).join('')}</div>`}).join('')}`}
function currentEx(id,i){const base=EX[id]?.[i];if(!base)return null;const override=data.programOverrides?.[id+'|'+i];return override? [override.name||base[0],override.description||base[1],Number(override.sets)||base[2],override.kg??base[3],Number(override.reps)||base[4],Number(override.rest??base[5])]:base}
function activeEx(id){return (EX[id]||[]).map((_,i)=>currentEx(id,i)).filter(Boolean)}
function formInput(label,key,val,type='number',extra=''){return `<label>${label}<input data-field="${key}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(val??'')}" ${extra}></label>`}function renderSession(){const s=sessions.find(x=>x.id===openId),v=get(s.id,date);let html=`<button data-back="1">← Retour</button><div class="card"><h2>${esc(s.name)}</h2><small>${date} · ${s.optional?'Facultatif':'Prévu'}</small>`;if(s.kind==='strength'){html+=`<p class="mini">Note chaque série réellement effectuée. Les charges proposées sont indicatives et doivent rester sans douleur.</p>`;activeEx(s.id).forEach((ex,i)=>{let sets=v.sets?.[i]||[];html+=`<div class="exercise"><div class="row"><b>${esc(ex[0])}</b><button data-timer="${data.restPrefs[s.id+'|'+i]??(date==='2026-10-12'&&s.id==='push'&&i===0?120:ex[5])}">⏱ Démarrer</button></div><p class="mini">${esc(ex[1])}</p><div class="row"><small>Repos conseillé : ${ex[5]} s</small><label style="width:130px">Mon repos (s)<input type="number" min="0" max="1200" step="15" data-restpref="${s.id}|${i}" value="${data.restPrefs[s.id+'|'+i]??(date==='2026-10-12'&&s.id==='push'&&i===0?120:ex[5])}"></label></div>${v.finishedExercises?.[i]?'<p class="ok">✓ Exercice terminé · Réouvrir pour modifier</p>':Array.from({length:ex[2]+(v.extraSets?.[i]||0)},(_,j)=>{let a=sets[j]||{};return `<div class="setgrid">${formInput('Série '+(j+1)+' · kg',`sets.${i}.${j}.kg`,a.kg??(j<ex[2]?ex[3]:''))}${formInput('Répétitions',`sets.${i}.${j}.reps`,a.reps??(j<ex[2]?ex[4]:''))}${formInput('RPE',`sets.${i}.${j}.rpe`,a.rpe??'')}</div>`}).join('')}<div class="actions"><button data-addset="${i}">＋ Ajouter une série</button><button data-finishex="${i}">${v.finishedExercises?.[i]?'↶ Réouvrir':'✓ Fait'}</button></div></div>`})}else if(s.kind==='pushups'){const plan=pushPlan(s.id,date);html+=`<p class="mini">Cible : ${plan.join(' / ')} · 2 min de repos. N'augmente que si les séries restent propres et bien tolérées.</p>`+plan.map((n,i)=>`<div class="row car function trend(values,title,suffix=''){if(!values.length)return `<div class="card"><b>${title}</b><p class="muted">Aucune donnée pour le moment.</p></div>`;let nums=values.map(x=>x.v),min=Math.min(...nums),max=Math.max(...nums);if(max===min){max+=1;min-=1}const points=values.map((x,i)=>`${22+i*290/Math.max(1,values.length-1)},${120-(x.v-min)/(max-min)*95}`).join(' ');return `<div class="card"><b>${title}</b><svg viewBox="0 0 335 145" aria-label="Progression ${title}"><line x1="22" y1="120" x2="320" y2="120" stroke="#666971"/><polyline points="${points}" stroke="#e8a061" stroke-width="3" fill="none"/>${values.map((x,i)=>`<circle cx="${22+i*290/Math.max(1,values.length-1)}" cy="${120-(x.v-min)/(max-min)*95}" r="4" fill="#e8a061"/>`).join('')}</svg><small>Début : ${nums[0]}${suffix} · Dernier : ${nums.at(-1)}${suffix}</small></div>`}
function renderProgress(){let items=Object.entries(data.entries).filter(([k,v])=>v.done).sort((a,b)=>a[0].localeCompare(b[0]));let bench=[],bike=[],rpm=[],push=[];items.forEach(([k,v])=>{let [d,id]=k.split('|');if(id==='push'&&v.sets?.[0]?.[0]){let a=v.sets[0][0];if(+a.kg>0&&+a.reps>0)bench.push({d,v:+a.kg*+a.reps})}if(id.startsWith('bike')&&+v.watts>0)bike.push({d,v:+v.watts});if(id.startsWith('bike')&&+v.rpm>0)rpm.push({d,v:+v.rpm});if(id==='pompesA'&&v.push)push.push({d,v:v.push.reduce((a,b)=>a+(+b||0),0)})});return safeSuggestions()+`<div class="grid"><div class="card"><h2>${items.length}</h2><small>Séances enregistrées</small></div><div class="card"><h2>65</h2><small>Record pompes initial</small></div></div>${trend(bench,'Développé couché · volume première série',' kg·reps')}${trend(push,'Pompes A · volume total',' reps')}${trend(bike,'BikeErg · watts moyens',' W')}${trend(rpm,'BikeErg · cadence moyenne',' RPM')}<h2>Historique</h2>${items.slice(-25).reverse().map(([k,v])=>`<button class="card row" style="width:100%;text-align:left" data-history="${esc(k)}"><span><b>${esc(sessions.find(s=>s.id===k.split('|')[1])?.name||k)}</b><br><small>${k.split('|')[0]} · fatigue ${esc(v.fatigue||'–')}/10 · genou ${esc(v.knee||'–')}/10</small></span><span>›</span></button>`).join('')||'<p class="muted">Aucune séance enregistrée.</p>'}<div class="card"><b>Référence du 12 octobre</b><p class="mini">Développé couché : 70 kg × 8/8/8/8, RPE 7 sur la dernière série. Record de pompes : 65.</p></div>`}

function progressProposal(key){const [id,iRaw]=key.split('|'),i=+iRaw,ex=currentEx(id,i);if(!ex)return null;const finished=Object.entries(data.entries).filter(([k,v])=>k.endsWith('|'+id)&&v.done&&v.sets?.[i]?.length).sort((a,b)=>a[0].localeCompare(b[0]));if(!finished.length)return null;const [k,v]=finished.at(-1);const rows=v.sets[i],rpe=Number(rows.at(-1)?.rpe),knee=Number(v.knee||0),arm=Number(v.arm||0),target=Number(ex[4]),sets=Number(ex[2]);if(rows.length<sets||!Number.isFinite(rpe)||!rpe||knee>=3||arm>=3||rpe>8||rows.slice(0,sets).some(r=>Number(r.reps)<target))return null;const next=target>=12?{kg:(Number(ex[3])||0)+((id==='push'&&i===0)?2.5:1),reps:Math.max(8,target-2)}:{kg:ex[3],reps:target+1};if(!Number(ex[3])||next.kg===0)return null;const override={name:ex[0],description:ex[1],sets:ex[2],kg:next.kg,reps:next.reps,rest:ex[5]};return {override,description:`${ex[0]} : ${ex[3]} kg × ${ex[2]}×${target} → ${next.kg} kg × ${ex[2]}×${next.reps}`,date:k.slice(0,10)}}

// V5.3.3.1 — Navigation robuste et correction de date d'une séance terminée.
function safeSuggestions(){try{return renderSuggestions()}catch(err){console.error('Progression guidée :',err);return '<div class="card"><h3>Progression guidée</h3><p class="mini">Recommandations temporairement indisponibles. Ton historique reste accessible.</p></div>'}}

document.addEventListener('click',e=>{

 if(!openId)return;const newDate=document.querySelector('#completedDate')?.value;
 if(!/^\d{4}-\d{2}-\d{2}$/.test(newDate||'')){alert('Choisis une date valide.');return}
 if(newDate===date){alert('La date est déjà correcte.');return}

 if(!data.entries[from]?.done){alert('Seule une séance terminée peut être déplacée.');return}
 if(data.entries[to]){alert('Une séance de ce type existe déjà à cette date. Aucun résultat n’a été remplacé.');return}
 if(!confirm(`Déplacer la séance du ${oldDate} au ${newDate} ? Toutes les séries et notes seront conservées.`))return;
 const v=structuredClone(data.entries[from]);data.entries[to]=v;delete data.entries[from];
 const oldIds=scheduledIds(oldDate),newIds=scheduledIds(newDate);
 data.schedule[oldDate]=oldIds.filter(x=>x!==id);

// V5.3.3.3 — Suggestions résilientes : une entrée historique incomplète ne masque plus toutes les recommandations.
function validExerciseHistory(id,i){
 const entries=data.entries&&typeof data.entries==='object'?data.entries:{};
 return Object.entries(entries).filter(([key,v])=>{
   if(!v||typeof v!=='object'||!v.done||!key.endsWith('|'+id))return false;
   return Array.isArray(v.sets)&&Array.isArray(v.sets[i])&&v.sets[i].some(r=>r&&Number(r.reps)>0);
 }).sort((a,b)=>a[0].localeCompare(b[0]));
}
lastExercise=function(id,i,beforeDate){
 const records=validExerciseHistory(id,i).filter(([key])=>key.slice(0,10)<beforeDate);
 if(!records.length)return null;
 const [key,entry]=records.at(-1);
 return {date:key.slice(0,10),entry,rows:entry.sets[i].filter(r=>r&&typeof r==='object')};
};
function reliableSuggestions(){
 const decisions=data.progressDecisions&&typeof data.progressDecisions==='object'?data.progressDecisions:{};
 const proposals=[],errors=[];
 for(const [id,exercises] of Object.entries(EX)){
  if(!Array.isArray(exercises))continue;
  for(let i=0;i<exercises.length;i++){
   const key=id+'|'+i;
   try{
    const p=progressProposal(key);
    if(p&&decisions[key]?.date!==todayISO())proposals.push({key,p});
   }catch(error){console.warn('Suggestion ignorée pour '+key,error);errors.push(key)}
  }
 }
 const elapsed=(Date.parse(todayISO()+'T12:00:00')-Date.parse(String(data.cycleStart||'2026-10-12')+'T12:00:00'))/86400000;
 const cards=proposals.slice(0,5).map(({key,p})=>`<div class="exercise"><b>${esc(p.description)}</b><p class="mini">Dernière séance : ${esc(p.date)}</p><div class="actions"><button class="primary" data-accept-progress="${esc(key)}">Accepter</button><button data-reject-progress="${esc(key)}">Plus tard</button></div></div>`).join('');
 return `<div class="card suggestion"><h3>Progression guidée</h3><p class="mini">Basée sur tes performances enregistrées. Une proposition reste facultative et doit être validée.</p>${cards||'<p class="mini">Aucune augmentation conseillée actuellement. Continue à enregistrer tes séries et ton RPE.</p>'}${errors.length?`<p class="notice">${errors.length} exercice(s) n’ont pas pu être analysés. Les autres recommandations restent disponibles.</p>`:''}${Number.isFinite(elapsed)&&elapsed>=42?'<p class="notice">Cycle de 6 à 8 semaines : un bilan peut être utile.</p>':''}</div>`;
}
renderSuggestions=reliableSuggestions;
// Ne pas conserver une proposition périmée entre son affichage et sa validation.

// V5.3.3.3 — validation explicite des pompes, sans réussite fictive.
// Chaque répétition saisie reste un brouillon jusqu'au clic « Série validée ».
const previousPushRender=renderSession;
renderSession=function(){
 let h=previousPushRender();
 const s=sessions.find(x=>x.id===openId);
 if(s?.kind!=='pushups')return h;
 const v=get(openId,date),targets=pushPlan(openId,date);
 // Le formulaire historique conserve les mêmes data-field push.i pour les sauvegardes JSON.
 const rows=targets.map((target,i)=>{
  const done=v.pushValidated?.[i]===true;
  const saved=done?(v.push?.[i]??target):'';
  return `<div class="card push-series ${done?'push-complete':''}" data-push-row="${i}"><div class="push-series-top"><div><b>Série ${i+1}</b><br><small>Objectif : ${target} pompes</small></div><span class="push-state">${done?'✓ Validée':'À effectuer'}</span></div><div class="push-series-actions"><label>Réalisées<input type="number" inputmode="numeric" min="0" max="250" step="1" data-field="push.${i}" value="${esc(saved)}" placeholder="${target}"></label><button type="button" class="${done?'done':'primary'}" data-confirm-push="${i}">${done?'↶ Modifier':'✓ Série validée'}</button></div><p class="mini push-hint">${done?'Série enregistrée. Tu peux la corriger.':'Un appui valide l’objectif ; saisis un autre nombre si tu as fait moins.'}</p></div>`;
 }).join('');
 // Supprimer UNIQUEMENT les anciennes lignes, puis injecter les nouvelles cartes
 // avant le bloc de ressenti. Ne jamais supprimer les nouvelles cartes générées.
 h=h.replace(/<div class="row card"><b>Série \d+ · cible \d+<\/b>[\s\S]*?<button data-timer="120">⏱<\/button><\/div>/g,'');
 const marker='<div class="card push-coach">';
 if(h.includes(marker)) h=h.replace(marker,rows+marker);
 else {
   const footer='<div class="grid">';
   if(h.includes(footer))h=h.replace(footer,rows+footer);
   else throw new Error('Emplacement des séries de pompes introuvable');
 }
 // Hide complexity unless requested; keep all data-field values in the DOM for capture().
 h=h.replace('<div class="card push-coach">','<div class="card push-coach">');

};
// Capture-phase handlers run before the generic application click handler.

 if(!input)return;

document.addEventListener('click',e=>{

 if(v.pushQuality==='propre'&&(v.pushReserve===''||v.pushReserve===undefined)){

// Les anciens historiques sans validation explicite ne sont jamais considérés comme trois réussites nouvelles.
const originalPushTargets=pushTargets;
pushTargets=function(id,d){
 const base=initialPushTargets[id]||[20,20,20],history=pushHistory(id,d);
 let level=0,streak=0;
 for(const [key,v] of history){
  const targets=base.map(n=>n+level*2);
  const confirmed=Array.isArray(v.pushValidated)&&targets.every((_,i)=>v.pushValidated[i]===true);
  const complete=confirmed&&targets.every((n,i)=>Number(v.push?.[i])>=n);
  const reserve=v.pushReserve!==''&&v.pushReserve!=null?Number(v.pushReserve):NaN;
  const good=complete&&v.pushQuality==='propre'&&Number.isFinite(reserve)&&reserve>=3&&Number(v.arm||0)<3&&Number(v.fatigue||0)<8;
  streak=good?streak+1:0;
  if(streak>=3){level++;streak=0}
 }
 return {targets:base.map(n=>n+level*2),level,streak,remaining:3-streak};
};

 });
};
