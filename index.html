'use strict';
const KEY='mon-training-v2-local';const todayISO=()=>{const d=new Date();return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')};
const DAYS=['Lundi','Mardi','Mercredi','Jeudi','Vendredi','Samedi','Dimanche'];const short=['L','M','M','J','V','S','D'];const isoOf=(d)=>{const z=new Date(d);return [z.getFullYear(),String(z.getMonth()+1).padStart(2,'0'),String(z.getDate()).padStart(2,'0')].join('-')};const monday=(d)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return x};const plus=(d,n)=>{let x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return isoOf(x)};const idx=d=>(new Date(d+'T12:00:00').getDay()+6)%7;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

let view='today',date=todayISO(),openId=null;function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Stockage indisponible : exporte tes données depuis Données.');return false}}const eid=(s,d)=>d+'|'+s;function get(s,d){return data.entries[eid(s,d)]||{}}function set(s,d,patch){data.entries[eid(s,d)]={...get(s,d),...patch};persist()}function all(d){const moved=data.schedule?.[d];return moved?moved.map(id=>sessions.find(s=>s.id===id)).filter(Boolean):sessions.filter(s=>s.day===idx(d))}function header(){return `<div class="hero"><small>MON TRAINING V5.3.3.8 • STOCKAGE LOCAL</small><h1>${view==='today'?'Ta séance du jour':view==='week'?'Planning hebdomadaire':view==='progress'?'Ta progression':view==='lexicon'?'Lexique des exercices':'Sauvegardes & réglages'}</h1><span class="mini">Objectif : physique athlétique • 100 pompes • genou renforcé</span></div>`}function status(s,d){return get(s.id,d).done?' <span class="ok">✓ Terminée</span>':''}function dayButtons(){let m=isoOf(monday(date));return `<div class="days">${DAYS.map((_,i)=>`<button class="${date===plus(m,i)?'active':''}" data-date="${plus(m,i)}">${short[i]}<br>${plus(m,i).slice(8)}</button>`).join('')}</div>`}function renderToday(){return `<div class="row"><button data-shift="-7">‹ Sem.</button><b>${esc(new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'}))}</b><button data-shift="7">Sem. ›</button></div>${dayButtons()}<h2>${DAYS[idx(date)]}</h2>${all(date).map(s=>`<button class="card row" style="width:100%;text-align:left" data-open="${s.id}"><span><b>${esc(s.name)}</b><br><small>${s.optional?'Facultatif · ':''}${s.kind==='strength'?'Charges, répétitions, RPE':s.kind==='pushups'?'Séries et récupération':s.kind==='bike'?'20 minutes':s.kind==='knee'?'Stabilité et renforcement':'Suivi de séance'}</small></span><span>${status(s,date)||'›'}</span></button>`).join('')||'<p>Repos.</p>'}<div class="notice">Douleur persistante au genou ou au bras : réduis la charge et fais évaluer les symptômes. Le WOD remplace une séance, il ne s’ajoute pas à une semaine déjà fatigante.</div>`}function renderWeek(){const m=isoOf(monday(date));return `<div class="row"><button data-shift="-7">‹</button><b>Semaine du ${m.split('-').reverse().join('/')}</b><button data-shift="7">›</button></div>${DAYS.map((n,i)=>{const d=plus(m,i),list=all(d);return `<div class="card"><div class="row"><b>${n} ${d.slice(8)}</b><button data-date="${d}">Ouvrir</button></div>${list.map(s=>`<div class="mini" style="padding:5px 0">${get(s.id,d).done?'✓ ':'○ '}${esc(s.name)}</div>`).join('')}</div>`}).join('')}`}
function currentEx(id,i){const base=EX[id]?.[i];if(!base)return null;const override=data.programOverrides?.[id+'|'+i];return override? [override.name||base[0],override.description||base[1],Number(override.sets)||base[2],override.kg??base[3],Number(override.reps)||base[4],Number(override.rest??base[5])]:base}
function activeEx(id){return (EX[id]||[]).map((_,i)=>currentEx(id,i)).filter(Boolean)}
function formInput(label,key,val,type='number',extra=''){return `<label>${label}<input data-field="${key}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(val??'')}" ${extra}></label>`}function renderSession(){const s=sessions.find(x=>x.id===openId),v=get(s.id,date);let html=`<button data-back="1">← Retour</button><div class="card"><h2>${esc(s.name)}</h2><small>${date} · ${s.optional?'Facultatif':'Prévu'}</small>`;if(s.kind==='strength'){html+=`<p class="mini">Note chaque série réellement effectuée. Les charges proposées sont indicatives et doivent rester sans douleur.</p>`;activeEx(s.id).forEach((ex,i)=>{let sets=v.sets?.[i]||[];html+=`<div class="exercise"><div class="row"><b>${esc(ex[0])}</b><button data-timer="${data.restPrefs[s.id+'|'+i]??(date==='2026-10-12'&&s.id==='push'&&i===0?120:ex[5])}">⏱ Démarrer</button></div><p class="mini">${esc(ex[1])}</p><div class="row"><small>Repos conseillé : ${ex[5]} s</small><label style="width:130px">Mon repos (s)<input type="number" min="0" max="1200" step="15" data-restpref="${s.id}|${i}" value="${data.restPrefs[s.id+'|'+i]??(date==='2026-10-12'&&s.id==='push'&&i===0?120:ex[5])}"></label></div>${v.finishedExercises?.[i]?'<p class="ok">✓ Exercice terminé · Réouvrir pour modifier</p>':Array.from({length:ex[2]+(v.extraSets?.[i]||0)},(_,j)=>{let a=sets[j]||{};return `<div class="setgrid">${formInput('Série '+(j+1)+' · kg',`sets.${i}.${j}.kg`,a.kg??(j<ex[2]?ex[3]:''))}${formInput('Répétitions',`sets.${i}.${j}.reps`,a.reps??(j<ex[2]?ex[4]:''))}${formInput('RPE',`sets.${i}.${j}.rpe`,a.rpe??'')}</div>`}).join('')}<div class="actions"><button data-addset="${i}">＋ Ajouter une série</button><button data-finishex="${i}">${v.finishedExercises?.[i]?'↶ Réouvrir':'✓ Fait'}</button></div></div>`})}else if(s.kind==='pushups'){const plan=pushPlan(s.id,date);html+=`<p class="mini">Cible : ${plan.join(' / ')} · 2 min de repos. N'augmente que si les séries restent propres et bien tolérées.</p>`+plan.map((n,i)=>`<div class="row car function trend(values,title,suffix=''){if(!values.length)return `<div class="card"><b>${title}</b><p class="muted">Aucune donnée pour le moment.</p></div>`;let nums=values.map(x=>x.v),min=Math.min(...nums),max=Math.max(...nums);if(max===min){max+=1;min-=1}const points=values.map((x,i)=>`${22+i*290/Math.max(1,values.length-1)},${120-(x.v-min)/(max-min)*95}`).join(' ');return `<div class="card"><b>${title}</b><svg viewBox="0 0 335 145" aria-label="Progression ${title}"><line x1="22" y1="120" x2="320" y2="120" stroke="#666971"/><polyline points="${points}" stroke="#e8a061" stroke-width="3" fill="none"/>${values.map((x,i)=>`<circle cx="${22+i*290/Math.max(1,values.length-1)}" cy="${120-(x.v-min)/(max-min)*95}" r="4" fill="#e8a061"/>`).join('')}</svg><small>Début : ${nums[0]}${suffix} · Dernier : ${nums.at(-1)}${suffix}</small></div>`}
function renderProgress(){let items=Object.entries(data.entries).filter(([k,v])=>v.done).sort((a,b)=>a[0].localeCompare(b[0]));let bench=[],bike=[],rpm=[],push=[];items.forEach(([k,v])=>{let [d,id]=k.split('|');if(id==='push'&&v.sets?.[0]?.[0]){let a=v.sets[0][0];if(+a.kg>0&&+a.reps>0)bench.push({d,v:+a.kg*+a.reps})}if(id.startsWith('bike')&&+v.watts>0)bike.push({d,v:+v.watts});if(id.startsWith('bike')&&+v.rpm>0)rpm.push({d,v:+v.rpm});if(id==='pompesA'&&v.push)push.push({d,v:v.push.reduce((a,b)=>a+(+b||0),0)})});return safeSuggestions()+`<div class="grid"><div class="card"><h2>${items.length}</h2><small>Séances enregistrées</small></div><div class="card"><h2>65</h2><small>Record pompes initial</small></div></div>${trend(bench,'Développé couché · volume première série',' kg·reps')}${trend(push,'Pompes A · volume total',' reps')}${trend(bike,'BikeErg · watts moyens',' W')}${trend(rpm,'BikeErg · cadence moyenne',' RPM')}<h2>Historique</h2>${items.slice(-25).reverse().map(([k,v])=>`<button class="card row" style="width:100%;text-align:left" data-history="${esc(k)}"><span><b>${esc(sessions.find(s=>s.id===k.split('|')[1])?.name||k)}</b><br><small>${k.split('|')[0]} · fatigue ${esc(v.fatigue||'–')}/10 · genou ${esc(v.knee||'–')}/10</small></span><span>›</span></button>`).join('')||'<p class="muted">Aucune séance enregistrée.</p>'}<div class="card"><b>Référence du 12 octobre</b><p class="mini">Développé couché : 70 kg × 8/8/8/8, RPE 7 sur la dernière série. Record de pompes : 65.</p></div>`}

function progressProposal(key){const [id,iRaw]=key.split('|'),i=+iRaw,ex=currentEx(id,i);if(!ex)return null;const finished=Object.entries(data.entries).filter(([k,v])=>k.endsWith('|'+id)&&v.done&&v.sets?.[i]?.length).sort((a,b)=>a[0].localeCompare(b[0]));if(!finished.length)return null;const [k,v]=finished.at(-1);const rows=v.sets[i],rpe=Number(rows.at(-1)?.rpe),knee=Number(v.knee||0),arm=Number(v.arm||0),target=Number(ex[4]),sets=Number(ex[2]);if(rows.length<sets||!Number.isFinite(rpe)||!rpe||knee>=3||arm>=3||rpe>8||rows.slice(0,sets).some(r=>Number(r.reps)<target))return null;const next=target>=12?{kg:(Number(ex[3])||0)+((id==='push'&&i===0)?2.5:1),reps:Math.max(8,target-2)}:{kg:ex[3],reps:target+1};if(!Number(ex[3])||next.kg===0)return null;const override={name:ex[0],description:ex[1],sets:ex[2],kg:next.kg,reps:next.reps,rest:ex[5]};return {override,description:`${ex[0]} : ${ex[3]} kg × ${ex[2]}×${target} → ${next.kg} kg × ${ex[2]}×${next.reps}`,date:k.slice(0,10)}}

const renderTodayBefore539c=renderToday;

 const dayRecords=Object.entries(data.entries||{}).filter(([k,v])=>k.startsWith(date+'|')&&v&&v.done);
 const standalone=dayRecords.find(([k])=>k.endsWith('|stretch39'));
 const attached=dayRecords.filter(([k,v])=>!k.endsWith('|stretch39')&&v.stretchesDone);
 const status=standalone||attached.length?'✓ Étirements effectués':'○ Étirements non cochés';
 const detail=standalone?'Séance étirements enregistrée':attached.length?'Validés dans '+attached.map(([k])=>sessions.find(x=>x.id===k.split('|')[1])?.name||'une séance').join(', '):'5 minutes facultatives';
 const panel=`<div class="card" id="stretch-status-539c"><div class="row"><div><b>Mes étirements · ${esc(date)}</b><p class="mini">${esc(status)} · ${esc(detail)}</p></div><button data-quick39="stretch39">${standalone?'Voir':'Ouvrir'}</button></div>${standalone?`<button data-delete-entry-539c="${esc(standalone[0])}" class="mini">Supprimer cette séance d’étirements</button>`:''}</div>`;
 return h+panel;
};
const renderProgressBefore539c=renderProgress;

 // Supprimer depuis Progrès une séance complète, après confirmation. Ne jamais effacer les autres séances du jour.
 h=h.replace(/(<button class="card row"[^>]*data-history="([^"]+)"[\s\S]*?<\/button>)/g,(whole,button,key)=>{
   if(!data.entries[key]?.done)return whole;
   return `<div class="history-row-539c">${whole}<button type="button" data-delete-entry-539c="${key}" class="delete-entry-539c" title="Supprimer uniquement cette séance">Supprimer</button></div>`;
 });return h;
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-delete-entry-539c]');if(!b)return;
 e.preventDefault();e.stopImmediatePropagation();const key=b.getAttribute('data-delete-entry-539c');
 if(!Object.prototype.hasOwnProperty.call(data.entries,key))return;
 const [d,id]=key.split('|'),name=sessions.find(x=>x.id===id)?.name||'cette séance';
 if(!confirm(`Supprimer définitivement « ${name} » du ${d} ?\nCette action supprime uniquement cet enregistrement. Pense à conserver une sauvegarde JSON.`))return;

},true);

 h+=`<details class="card"><summary><b>Gérer les activités du jour</b></summary><p class="mini">Une activité ignorée ne compte pas comme effectuée et n’est plus à valider.</p>${v10AllBefore(date).map(s=>`<div class="row v10-action"><span>${esc(s.name)}<br><small>${get(s.id,date).done?'✓ Effectuée':v10Ignored(s.id,date)?'↷ Ignorée':'○ Non effectuée'}</small></span>${!get(s.id,date).done?`<button data-v10-ignore="${esc(s.id)}">${v10Ignored(s.id,date)?'Réactiver':'Ignorer'}</button>`:''}</div>`).join('')||'<p class="mini">Aucune activité prévue.</p>'}</details>`;

 // Suppression des champs de douleur uniquement dans les formulaires. Les valeurs historiques restent en stockage.
 h=h.replace(/<label>Douleur (?:genou|bras) \/10<input[^>]*><\/label>/g,'');

// Tableau de bord de progression : chiffres réellement calculés à partir des séances terminées.
renderProgress=function(){
 const items=Object.entries(data.entries||{}).filter(([k,v])=>v&&v.done).sort((a,b)=>b[0].localeCompare(a[0]));
 const days=[...new Set(items.map(([k])=>k.slice(0,10)))];
 const now=todayISO(),month=now.slice(0,7),monthItems=items.filter(([k])=>k.startsWith(month));
 const bike=items.filter(([k])=>v10IsBike(k.split('|')[1]));
 const totalBikeMin=bike.reduce((n,[k,v])=>n+(Number(v.minutes)||0),0);
 const calories=bike.filter(([k,v])=>v.calories!==''&&v.calories!=null&&Number.isFinite(+v.calories)&&+v.calories>=0);
 const kcal=calories.reduce((n,[k,v])=>n+Number(v.calories),0);
 const byDate={};for(const item of items)(byDate[item[0].slice(0,10)] ||= []).push(item);
 const stat=(val,label)=>`<div class="card"><h2>${val}</h2><small>${label}</small></div>`;
 const period=(data.vacationPeriods||[]).length;
 const filter=data.v10Graph||'sessions';
 const graphData=(()=>{const recent=Array.from({length:8},(_,i)=>plus(isoOf(monday(now)),-7*(7-i)));return recent.map(start=>{const end=plus(start,6),rows=items.filter(([k])=>k.slice(0,10)>=start&&k.slice(0,10)<=end);let val=rows.length;if(filter==='bike')val=rows.filter(([k])=>v10IsBike(k.split('|')[1])).reduce((n,[k,v])=>n+(+v.minutes||0),0);if(filter==='push')val=rows.filter(([k])=>sessions.find(s=>s.id===k.split('|')[1])?.kind==='pushups').reduce((n,[k,v])=>n+(v.push||[]).reduce((a,b)=>a+(+b||0),0),0);if(filter==='strength')val=rows.filter(([k])=>sessions.find(s=>s.id===k.split('|')[1])?.kind==='strength').length;return {d:start,v:val}})})();
 const max=Math.max(1,...graphData.map(x=>x.v));
 const graph=`<div class="card"><div class="row"><b>Évolution sur 8 semaines</b><span class="mini">${filter==='bike'?'Minutes BikeErg':filter==='push'?'Pompes réalisées':filter==='strength'?'Séances musculation':'Activités terminées'}</span></div><label>Indicateur<select id="v10-graph"><option value="sessions" ${filter==='sessions'?'selected':''}>Séances réalisées</option><option value="strength" ${filter==='strength'?'selected':''}>Musculation</option><option value="bike" ${filter==='bike'?'selected':''}>BikeErg · minutes</option><option value="push" ${filter==='push'?'selected':''}>Pompes · répétitions</option></select></label><div class="v10-bars">${graphData.map(x=>`<div class="v10-barcol"><span>${x.v}</span><i style="height:${Math.max(3,Math.round(x.v/max*95))}px"></i><small>${x.d.slice(8,10)}/${x.d.slice(5,7)}</small></div>`).join('')}</div><p class="mini">Données issues uniquement des séances terminées. Les vacances ne sont pas comptées comme des séances manquées.</p></div>`;
 const groups=Object.entries(byDate).sort((a,b)=>b[0].localeCompare(a[0]));
 return `<h2>Vue d'ensemble</h2><div class="grid">${stat(items.length,'Activités enregistrées')}${stat(monthItems.length,'Ce mois-ci')}${stat(days.length,'Jours actifs')}${stat(totalBikeMin+' min','BikeErg cumulé')}</div><div class="card"><b>Calories BikeErg saisies</b><h2>${Math.round(kcal)} kcal</h2><small>${calories.length} séance${calories.length>1?'s':''} avec calories renseignées · pas d’estimation automatique</small></div>${graph}<h2>Historique par journée</h2><p class="mini">Ouvre un jour, puis une séance pour consulter ses séries et commentaires.</p>${groups.map(([d,rows])=>`<details class="card v10-day"><summary><b>${esc(v10DateLabel(d))}</b><br><small>${rows.length} activité${rows.length>1?'s':''} · ${rows.map(([k])=>sessions.find(s=>s.id===k.split('|')[1])?.name?.split(' — ')[0]||'Activité').join(' · ')}</small></summary>${rows.map(([k,v])=>`<div class="v10-history"><button data-history="${esc(k)}"><b>${esc(sessions.find(s=>s.id===k.split('|')[1])?.name||k.split('|')[1])}</b><br><small>${v10IsBike(k.split('|')[1])?`${esc(v.minutes||'–')} min · ${v.calories!==undefined&&v.calories!==''?esc(v.calories)+' kcal · ':''}${esc(v.watts||'–')} W`:v.notes?esc(String(v.notes).slice(0,100)):'Voir séries et commentaires'}</small></button><button class="delete-entry-539c" data-delete-entry-539c="${esc(k)}">Supprimer</button></div>`).join('')}</details>`).join('')||'<div class="card">Aucune activité terminée.</div>'}<p class="mini">Les anciennes données et séries sont conservées. ${period?'Mode Vacances configuré.':''}</p>`;
};
const v10SettingsBefore=renderSettings;
renderSettings=function(){return `<div class="card"><h2>Mode Vacances</h2><p class="mini">Programme mis en pause pendant la période, reprise automatique sans rattrapage. Les activités libres restent possibles selon le mode choisi.</p><div class="grid"><label>Début<input id="v10-start" type="date" value="${todayISO()}"></label><label>Fin<input id="v10-end" type="date" value="${plus(todayISO(),7)}"></label></div><label>Fonctionnement<select id="v10-mode"><option value="pause">Pause complète</option><option value="free" selected>Activités libres uniquement</option><option value="normal">Maintenir le programme habituel</option></select></label><button class="primary" data-v10-addvac="1">Enregistrer la période</button>${(data.vacationPeriods||[]).map((p,i)=>`<div class="row v10-action"><small>${esc(p.start)} → ${esc(p.end)} · ${p.mode==='pause'?'Pause':p.mode==='free'?'Activités libres':'Programme habituel'}</small><button data-v10-delvac="${i}">Supprimer</button></div>`).join('')}</div>`+v10SettingsBefore()};
// Wake Lock : demande pendant une séance active, et libération en quittant.
let v10Wake=null,v10WakeFailed=false;
async function v10WakeSync(){const active=!!openId||!!(timerEnd>Date.now());if(!active){if(v10Wake){try{await v10Wake.release()}catch(e){}v10Wake=null}return}if(document.visibilityState!=='visible'||v10Wake||!('wakeLock' in navigator))return;try{v10Wake=await navigator.wakeLock.request('screen');v10Wake.addEventListener('release',()=>{v10Wake=null})}catch(e){v10WakeFailed=true}}

const v10CSS=document.createElement('style');v10CSS.textContent=`.v10-bars{display:flex;align-items:end;justify-content:space-between;gap:5px;min-height:155px;padding:20px 0 3px}.v10-barcol{display:flex;align-items:center;flex-direction:column;gap:5px;flex:1;min-width:0}.v10-barcol>span,.v10-barcol>small{font-size:10px;color:var(--muted)}.v10-barcol>i{width:75%;max-width:34px;display:block;background:var(--accent);border-radius:5px 5px 0 0}.v10-day summary{line-height:1.7}.v10-history,.v10-action{display:flex;gap:8px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:10px 0}.v10-history>button:first-child{flex:1;text-align:left;min-width:0}.v10-history .delete-entry-539c{font-size:11px;color:#ffb0a4}`;document.head.append(v10CSS);

const SPORTS10B=[['sportRun10b','Course à pied'],['sportCycle10b','Vélo extérieur'],['sportWalk10b','Marche'],['sportHike10b','Randonnée'],['sportSwim10b','Natation'],['sportBasket10b','Basketball']];
for(const [id,name] of SPORTS10B)if(!sessions.some(s=>s.id===id))sessions.push({id,name,day:-1,kind:'custom39'});

const FREE_MENU10B=()=>`<div class="card"><h2>Ajouter une activité</h2><p class="mini">Choisis une séance de ton programme ou une activité sportive. Tu retrouveras son formulaire habituel et l'enregistrement à la date sélectionnée.</p><label>Activité<select id="free-select-10b"><optgroup label="Mes séances">${ALL_FREE10B.slice(0,13).map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('')}</optgroup><optgroup label="Cardio et sport">${SPORTS10B.map(([id,n])=>`<option value="${id}">${esc(n)}</option>`).join('')}</optgroup><optgroup label="Personnalisée"><option value="free39">Autre activité</option></optgroup></select></label><button class="primary" data-free-open-10b="1">Ouvrir l'activité</button><button data-free-close-10b="1">Annuler</button></div>`;
let freeMenu10B=false;

renderToday=function(){let h=oldToday10B();const vac=v10Vacation(date);if(vac?.mode==='pause')return h;const block=`<div class="card"><button class="primary" data-free-toggle-10b="1">${freeMenu10B?'− Fermer les activités libres':'＋ Ajouter une activité libre'}</button>${freeMenu10B?FREE_MENU10B():''}</div>`;return h+block;};
const oldSession10B=renderSession;
renderSession=function(){const s=sessions.find(x=>x.id===openId);if(!s)return oldSession10B();let h;
 if(SPORTS10B.some(([id])=>id===openId)){
  const v=get(openId,date);
  h=`<button data-back="1">← Retour</button><div class="card"><h2>${esc(s.name)}</h2><p class="mini">Enregistre uniquement les données dont tu disposes.</p><div class="grid">${formInput('Durée (minutes)','activityMinutes',v.activityMinutes??'')}${formInput('Distance (km) · facultatif','activityDistance',v.activityDistance??'')}${formInput('Calories affichées (kcal) · facultatif','calories',v.calories??'')}</div><label>Ressenti et commentaires<textarea data-field="notes">${esc(v.notes||'')}</textarea></label><button class="primary" data-save="1">✓ Terminer</button><button data-back="1">Retour</button></div>`;

 // Retirer toute consigne d'échauffement introduite comme bloc autonome.
 h=h.replace(/<button[^>]*data-(?:skipwarmup|warmup)="[^"]*"[^>]*>[\s\S]*?<\/button>/g,'');

document.addEventListener('click',e=>{

// V5.3.3.10d TEST — rendre immédiatement visibles les activités libres terminées sur leur journée.
// Les données restent dans entries[date|id] : aucun déplacement ni réécriture de l'historique.
const v10dTodayBefore=renderToday;
renderToday=function(){
 let html=v10dTodayBefore();
 const completed=Object.entries(data.entries||{}).filter(([key,entry])=>key.startsWith(date+'|')&&entry?.done);
 if(!completed.length)return html;
 const scheduledIds=new Set(all(date).map(s=>s.id));
 const extra=completed.filter(([key])=>!scheduledIds.has(key.slice(11)));
 if(!extra.length)return html;
 const card=`<div class="card" id="v10d-activities"><h2>Activités ajoutées · ${esc(v10DateLabel(date))}</h2><p class="mini">${extra.length} activité${extra.length>1?'s':''} enregistrée${extra.length>1?'s':''} pour cette journée, y compris pendant les vacances.</p>${extra.map(([key,entry])=>{const id=key.slice(11),session=sessions.find(s=>s.id===id);const label=session?.name||entry.activityName||'Activité libre';return `<div class="row v10-action"><button data-open="${esc(id)}" style="flex:1;text-align:left"><b>✓ ${esc(label)}</b><br><small>Terminée · Voir les détails</small></button><button data-delete-entry-539c="${esc(key)}" class="delete-entry-539c">Supprimer</button></div>`}).join('')}</div>`;
 // Présentation au-dessus des accès rapides et des réglages du jour, pas tout en bas.
 const anchor='<div class="card"><b>Accès rapides</b>';
 return html.includes(anchor)?html.replace(anchor,card+anchor):card+html;
};
