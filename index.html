let view='today',date=todayISO(),openId=null;function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){alert('Stockage indisponible : exporte tes données depuis Données.');return false}}const eid=(s,d)=>d+'|'+s;function get(s,d){return data.entries[eid(s,d)]||{}}function set(s,d,patch){data.entries[eid(s,d)]={...get(s,d),...patch};persist()}function all(d){const moved=data.schedule?.[d];return moved?moved.map(id=>sessions.find(s=>s.id===id)).filter(Boolean):sessions.filter(s=>s.day===idx(d))}function header(){return `<div class="hero"><small>MON TRAINING V5.3.3.8 • STOCKAGE LOCAL</small><h1>${view==='today'?'Ta séance du jour':view==='week'?'Planning hebdomadaire':view==='progress'?'Ta progression':view==='lexicon'?'Lexique des exercices':'Sauvegardes & réglages'}</h1><span class="mini">Objectif : physique athlétique • 100 pompes • genou renforcé</span></div>`}function status(s,d){return get(s.id,d).done?' <span class="ok">✓ Terminée</span>':''}function dayButtons(){let m=isoOf(monday(date));return `<div class="days">${DAYS.map((_,i)=>`<button class="${date===plus(m,i)?'active':''}" data-date="${plus(m,i)}">${short[i]}<br>${plus(m,i).slice(8)}</button>`).join('')}</div>`}function renderToday(){return `<div class="row"><button data-shift="-7">‹ Sem.</button><b>${esc(new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{day:'numeric',month:'long'}))}</b><button data-shift="7">Sem. ›</button></div>${dayButtons()}<h2>${DAYS[idx(date)]}</h2>${all(date).map(s=>`<button class="card row" style="width:100%;text-align:left" data-open="${s.id}"><span><b>${esc(s.name)}</b><br><small>${s.optional?'Facultatif · ':''}${s.kind==='strength'?'Charges, répétitions, RPE':s.kind==='pushups'?'Séries et récupération':s.kind==='bike'?'20 minutes':s.kind==='knee'?'Stabilité et renforcement':'Suivi de séance'}</small></span><span>${status(s,date)||'›'}</span></button>`).join('')||'<p>Repos.</p>'}<div class="notice">Douleur persistante au genou ou au bras : réduis la charge et fais évaluer les symptômes. Le WOD remplace une séance, il ne s’ajoute pas à une semaine déjà fatigante.</div>`}function renderWeek(){const m=isoOf(monday(date));return `<div class="row"><button data-shift="-7">‹</button><b>Semaine du ${m.split('-').reverse().join('/')}</b><button data-shift="7">›</button></div>${DAYS.map((n,i)=>{const d=plus(m,i),list=all(d);return `<div class="card"><div class="row"><b>${n} ${d.slice(8)}</b><button data-date="${d}">Ouvrir</button></div>${list.map(s=>`<div class="mini" style="padding:5px 0">${get(s.id,d).done?'✓ ':'○ '}${esc(s.name)}</div>`).join('')}</div>`}).join('')}`}
function currentEx(id,i){const base=EX[id]?.[i];if(!base)return null;const override=data.programOverrides?.[id+'|'+i];return override? [override.name||base[0],override.description||base[1],Number(override.sets)||base[2],override.kg??base[3],Number(override.reps)||base[4],Number(override.rest??base[5])]:base}
function activeEx(id){return (EX[id]||[]).map((_,i)=>currentEx(id,i)).filter(Boolean)}
function formInput(label,key,val,type='number',extra=''){return `<label>${label}<input data-field="${key}" type="${type}" ${type==='number'?'step="any"':''} value="${esc(val??'')}" ${extra}></label>`}function renderSession(){const s=sessions.find(x=>x.id===openId),v=get(s.id,date);let html=`<button data-back="1">← Retour</button><div class="card"><h2>${esc(s.name)}</h2><small>${date} · ${s.optional?'Facultatif':'Prévu'}</small>`;if(s.kind==='strength'){html+=`<p class="mini">Note chaque série réellement effectuée. Les charges proposées sont indicatives et doivent rester sans douleur.</p>`;activeEx(s.id).forEach((ex,i)=>{let sets=v.sets?.[i]||[];html+=`<div class="exercise"><div class="row"><b>${esc(ex[0])}</b><button data-timer="${data.restPrefs[s.id+'|'+i]??(date==='2026-10-12'&&s.id==='push'&&i===0?120:ex[5])}">⏱ Démarrer</button></div><p class="mini">${esc(ex[1])}</p><div class="row"><small>Repos conseillé : ${ex[5]} s</small><label style="width:130px">Mon repos (s)<input type="number" min="0" max="1200" step="15" data-restpref="${s.id}|${i}" value="${data.restPrefs[s.id+'|'+i]??(date==='2026-10-12'&&s.id==='push'&&i===0?120:ex[5])}"></label></div>${v.finishedExercises?.[i]?'<p class="ok">✓ Exercice terminé · Réouvrir pour modifier</p>':Array.from({length:ex[2]+(v.extraSets?.[i]||0)},(_,j)=>{let a=sets[j]||{};return `<div class="setgrid">${formInput('Série '+(j+1)+' · kg',`sets.${i}.${j}.kg`,a.kg??(j<ex[2]?ex[3]:''))}${formInput('Répétitions',`sets.${i}.${j}.reps`,a.reps??(j<ex[2]?ex[4]:''))}${formInput('RPE',`sets.${i}.${j}.rpe`,a.rpe??'')}</div>`}).join('')}<div class="actions"><button data-addset="${i}">＋ Ajouter une série</button><button data-finishex="${i}">${v.finishedExercises?.[i]?'↶ Réouvrir':'✓ Fait'}</button></div></div>`})}else if(s.kind==='pushups'){const plan=pushPlan(s.id,date);html+=`<p class="mini">Cible : ${plan.join(' / ')} · 2 min de repos. N'augmente que si les séries restent propres et bien tolérées.</p>`+plan.map((n,i)=>`<div class="row card"><b>Série ${i+1} · cible ${n}</b><div style="width:100px">${formInput('Réalisées',`push.${i}`,v.push?.[i]??n)}</div><button data-timer="120">⏱</button></div>`).join('')}else if(s.kind==='bike'){html+=`<p class="mini">${s.id==='bike1'?'Endurance facile, RPE 3–4/10':s.id==='bike2'?'Endurance facile les 2 premières semaines, puis 5 min faciles + 5 × (1 min soutenue / 1 min facile) + 5 min faciles si genou OK':'Endurance régulière RPE 4–5/10'}</p><div class="grid">${formInput('Durée (min)','minutes',v.minutes??20)}${formInput('Distance (m)','distance',v.distance)}${formInput('Watts moyens','watts',v.watts)}${formInput('Cadence moyenne (RPM)','rpm',v.rpm)}${formInput('RPE /10','effort',v.effort)}</div>`}else{const list=s.kind==='mobility'?MOB:s.kind==='knee'?[['Split squat assisté','2 × 8/jambe'],['Équilibre sur coussin','2 × 30 s/jambe'],['Isométrie quadriceps','3 × 30 s']]:[['BikeErg','10 calories'],['Rowing TRX','8 répétitions'],['Pompes','8 répétitions'],['Squat banc haut (si toléré)','8 répétitions'],['Dead bug','10 alternées']];html+=s.kind==='wod'?formInput('Tours réalisés','rounds',v.rounds):'';html+=list.map((x,i)=>`<label class="card" style="display:flex;align-items:center;gap:12px"><input type="checkbox" data-check="${i}" ${v.checks?.[i]?'checked':''} style="width:22px;min-height:22px;margin:0"><span><b>${esc(x[0])}</b><br><small>${esc(x[1])}</small></span></label>`).join('')}
html+=`<div class="grid">${formInput('Douleur genou /10','knee',v.knee)}${formInput('Douleur bras /10','arm',v.arm)}${formInput('Fatigue /10','fatigue',v.fatigue)}${formInput('RPE séance /10','sessionRpe',v.sessionRpe)}</div><label>Notes / sensations<textarea data-field="notes">${esc(v.notes||'')}</textarea></label><button class="primary" style="width:100%;margin-top:12px" data-save="1">${v.done?'Mettre à jour la séance terminée':'✓ Terminer la séance'}</button><button style="width:100%;margin-top:8px" data-unfinish="1">Marquer comme non terminée</button></div>`;return html}
function trend(values,title,suffix=''){if(!values.length)return `<div class="card"><b>${title}</b><p class="muted">Aucune donnée pour le moment.</p></div>`;let nums=values.map(x=>x.v),min=Math.min(...nums),max=Math.max(...nums);if(max===min){max+=1;min-=1}const points=values.map((x,i)=>`${22+i*290/Math.max(1,values.length-1)},${120-(x.v-min)/(max-min)*95}`).join(' ');return `<div class="card"><b>${title}</b><svg viewBox="0 0 335 145" aria-label="Progression ${title}"><line x1="22" y1="120" x2="320" y2="120" stroke="#666971"/><polyline points="${points}" stroke="#3288F5" stroke-width="3" fill="none"/>${values.map((x,i)=>`<circle cx="${22+i*290/Math.max(1,values.length-1)}" cy="${120-(x.v-min)/(max-min)*95}" r="4" fill="#3288F5"/>`).join('')}</svg><small>Début : ${nums[0]}${suffix} · Dernier : ${nums.at(-1)}${suffix}</small></div>`}
function renderProgress(){let items=Object.entries(data.entries).filter(([k,v])=>v.done).sort((a,b)=>a[0].localeCompare(b[0]));let bench=[],bike=[],rpm=[],push=[];items.forEach(([k,v])=>{let [d,id]=k.split('|');if(id==='push'&&v.sets?.[0]?.[0]){let a=v.sets[0][0];if(+a.kg>0&&+a.reps>0)bench.push({d,v:+a.kg*+a.reps})}if(id.startsWith('bike')&&+v.watts>0)bike.push({d,v:+v.watts});if(id.startsWith('bike')&&+v.rpm>0)rpm.push({d,v:+v.rpm});if(id==='pompesA'&&v.push)push.push({d,v:v.push.reduce((a,b)=>a+(+b||0),0)})});return safeSuggestions()+`<div class="grid"><div class="card"><h2>${items.length}</h2><small>Séances enregistrées</small></div><div class="card"><h2>65</h2><small>Record pompes initial</small></div></div>${trend(bench,'Développé couché · volume première série',' kg·reps')}${trend(push,'Pompes A · volume total',' reps')}${trend(bike,'BikeErg · watts moyens',' W')}${trend(rpm,'BikeErg · cadence moyenne',' RPM')}<h2>Historique</h2>${items.slice(-25).reverse().map(([k,v])=>`<button class="card row" style="width:100%;text-align:left" data-history="${esc(k)}"><span><b>${esc(sessions.find(s=>s.id===k.split('|')[1])?.name||k)}</b><br><small>${k.split('|')[0]} · fatigue ${esc(v.fatigue||'–')}/10 · genou ${esc(v.knee||'–')}/10</small></span><span>›</span></button>`).join('')||'<p class="muted">Aucune séance enregistrée.</p>'}<div class="card"><b>Référence du 12 octobre</b><p class="mini">Développé couché : 70 kg × 8/8/8/8, RPE 7 sur la dernière série. Record de pompes : 65.</p></div>`}

function videoFor(name){return (data.videoPrefs && Object.prototype.hasOwnProperty.call(data.videoPrefs,name)) ? data.videoPrefs[name] : (CURATED_VIDEOS[name] || '');}

nnées actuelles après confirmation. Exporte toujours une sauvegarde avant toute restauration. Pour récupérer les séances manquantes, utilise uniquement le fichier réconcilié fourni.</p></div><div class="card"><h3>Gestion locale</h3><button id="clear">Effacer les données locales</button></div>`}

 for(const card of [...app.children]){

 }

 }
 // Retirer le bloc historique qui répète la séance déjà regroupée ci-dessous.
 for(const card of [...app.children]){

function mt721Rows(rows){
 if(Array.isArray(rows))return rows;

function mt721ExerciseName(id,i,v){

   const rows=mt721Rows(v.sets[i]).filter(r=>r&&typeof r==='object'&&(String(r.kg??'').trim()!==''||String(r.reps??'').trim()!==''));
   if(!rows.length)return '';
   const ex=mt721ExerciseName(id,i,v);
   const vals=rows.map(r=>{
    const kg=String(r.kg??'').trim(),reps=String(r.reps??'').trim();
    const unit=v.exerciseModes?.[i]==='duration'?'s':'rép';

   });
   const rest=data.restPrefs?.[id+'|'+i];
   return ex+' : '+vals.join(', ')+(rest!==undefined?' ; repos choisi '+rest+' s':'');
  }).filter(Boolean).join(' ; ');
  if(!details)details='Aucune serie exploitable enregistree';
 }else if(v.push){details='Pompes : '+v.push.join('/');}
 else if(id.toLowerCase().includes('bike')){
  details='BikeErg : '+(v.minutes||'?')+' min, '+(v.watts||'?')+' W, '+(v.distance||'?')+' m, '+(v.rpm||'?')+' RPM, RPE '+(v.effort||'?')+'/10';
 }else if(v.activityMinutes||v.activityDistance){
  details='Activite : '+(v.activityMinutes||'?')+' min, distance '+(v.activityDistance||'?');
 }else{details='Activites cochees : '+(v.checks?.filter(Boolean).length||0);}
 const val=x=>x===undefined||x===null||x===''?'?':x;
 return d+' — '+title+' ['+status+']\n'+details+'\nRPE séance '+val(v.sessionRpe)+' ; fatigue '+val(v.fatigue)+' ; douleur genou '+val(v.knee)+' ; douleur bras '+val(v.arm)+' ; notes : '+(v.notes||'aucune');
};
