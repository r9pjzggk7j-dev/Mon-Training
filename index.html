function trend(values,title,suffix=''){if(!values.length)return `<div class="card"><b>${title}</b><p class="muted">Aucune donnée pour le moment.</p></div>`;let nums=values.map(x=>x.v),min=Math.min(...nums),max=Math.max(...nums);if(max===min){max+=1;min-=1}const points=values.map((x,i)=>`${22+i*290/Math.max(1,values.length-1)},${120-(x.v-min)/(max-min)*95}`).join(' ');return `<div class="card"><b>${title}</b><svg viewBox="0 0 335 145" aria-label="Progression ${title}"><line x1="22" y1="120" x2="320" y2="120" stroke="#666971"/><polyline points="${points}" stroke="#e8a061" stroke-width="3" fill="none"/>${values.map((x,i)=>`<circle cx="${22+i*290/Math.max(1,values.length-1)}" cy="${120-(x.v-min)/(max-min)*95}" r="4" fill="#e8a061"/>`).join('')}</svg><small>Début : ${nums[0]}${suffix} · Dernier : ${nums.at(-1)}${suffix}</small></div>`}

const CURATED_VIDEOS = { "Développé couché":"https://www.youtube.com/shorts/0cXAp6WhSj4", "Développé incliné haltères":"https://www.youtube.com/watch?v=yLtzudAENb4", "Rowing poitrine soutenue":"https://www.youtube.com/watch?v=YsBNeZohqvk", "Triceps double poulie":"https://www.youtube.com/watch?v=BxJDbLSq2IE", "Curl marteau facultatif":"https://www.youtube.com/watch?v=KrCczEabCIQ", "Presse à cuisses":"https://www.youtube.com/watch?v=PB9hNl_ammI" };
function videoFor(name){return (data.videoPrefs && Object.prototype.hasOwnProperty.call(data.videoPrefs,name)) ? data.videoPrefs[name] : (CURATED_VIDEOS[name] || '');}
function videoBlock(name){const url=videoFor(name),safe=esc(name);return `<div style="margin-top:12px">${url?`<a class="videolink" href="${esc(url)}" target="_blank" rel="noopener noreferrer">▶ Ouvrir la vidéo choisie ↗</a>`:'<p class="mini">Vidéo de référence non encore sélectionnée pour cet exercice.</p>'}<details style="margin-top:8px"><summary class="mini">${url?'Remplacer ou retirer la vidéo':'Ajouter une vidéo directe'}</summary><label>Lien direct YouTube (vidéo, pas recherche)<input type="url" data-video-input="${safe}" value="${esc(url)}" placeholder="https://www.youtube.com/watch?v=..."></label><button data-video-save="${safe}">Enregistrer / retirer si vide</button></details></div>`;}

function renderLexicon(){return `<p class="mini">Démonstrations courtes (Shorts, 3 min maximum en principe). Sélection provisoire : vérifie que la variante correspond à ton exercice. Tu peux remplacer ou retirer chaque vidéo. Les exercices sans lien n’ouvrent pas de recherche.</p><label>Rechercher un exercice<input id="lexSearch" type="search" placeholder="Ex. développé couché, mobilité, BikeErg"></label><div id="lexItems">${lexItems('')}</div>`}
function lexItems(q){const activeNames=new Set([...Object.values(EX).flatMap((a,id)=>a.map((_,i)=>currentEx(Object.keys(EX)[id],i)?.[0])),...MOB.map(x=>x[0]),'BikeErg','Pompes','Équilibre sur coussin','Isométrie quadriceps','Rowing TRX','Squat banc haut','Split squat assisté'].map(x=>String(x||'').toLowerCase()));return LEXICON.filter(x=>activeNames.has(x[0].toLowerCase()) || [...activeNames].some(n=>n.includes(x[0].toLowerCase())||x[0].toLowerCase().includes(n))).filter(x=>x[0].toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').includes(q.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''))).map(x=>`<details class="card"><summary><b>${esc(x[0])}</b> <small>▾</small></summary><p><b>Muscles / objectif :</b> ${esc(x[1])}</p><p><b>Exécution :</b> ${esc(x[2])}</p><p><b>Attention :</b> ${esc(x[3])}</p>${videoBlock(x[0])}</details>`).join('')||'<p class="muted">Aucun exercice trouvé.</p>'}

function savedDates(){return [...new Set(Object.keys(data.entries).map(k=>k.slice(0,10)))].sort().reverse()}
function renderSettings(){const dates=savedDates(),last=dates[0]||todayISO();return `<div class="card"><h3>Copier ma séance</h3><p class="mini">Choisis une date enregistrée. Seules les séances de cette date seront copiées.</p><div class="date-row"><label>Date de la séance<select id="sessionDate">${dates.map(d=>`<option value="${d}">${d}</option>`).join('')||`<option value="${last}">${last}</option>`}</select></label><button class="primary" id="copySession">Copier ma séance</button></div></div><div class="card"><h3>Copier mon historique</h3><div class="actions"><button data-range="7">7 derniers jours</button><button data-range="30">30 derniers jours</button></div><div class="two-dates"><label>Du<input type="date" id="fromDate" value="${plus(todayISO(),-29)}"></label><label>Au<input type="date" id="toDate" value="${todayISO()}"></label></div><button class="primary" id="copyHistory" style="width:100%;margin-top:12px">Copier la période</button></div><div class="card"><h3>Coaching ChatGPT</h3><p class="mini">Transmets-moi le programme actif et les 8 dernières semaines pour réévaluer ton cycle. Après analyse, importe le fichier de modifications que je te fournirai.</p><button id="coachExport" class="primary">Copier mon dossier pour ChatGPT</button><button id="importCoach">Importer des ajustements ChatGPT (JSON)</button><input id="coachFile" type="file" accept=".json,application/json" class="hide"><p class="mini">Les modifications sont affichées avant validation. Aucune connexion directe à ChatGPT.</p><button id="undoCoach">Annuler la dernière modification du programme</button></div><div class="card"><h3>Sauvegarder mes données</h3><p class="mini">Sauvegarde complète des séances et du programme. Stockage uniquement dans ce navigateur.</p><button class="primary" id="export">Télécharger sauvegarde JSON</button></div><div class="card"><h3>Restaurer une sauvegarde</h3><input type="file" id="import" accept=".json,application/json"><p class="mini">La restauration remplace les données actuelles après confirmation. Conserve ton fichier V4.</p></div><div class="card"><h3>Gestion locale</h3><button id="clear">Effacer les données locales</button></div>`}
function formatEntry(k,v){const [d,id]=k.split('|');const s=sessions.find(s=>s.id===id);const status=v.done?'Terminée':'En cours';let details='';if(v.sets){details=v.sets.map((rows,i)=>{if(!rows)return '';const ex=currentEx(id,i);const vals=rows.map(r=>`${r.kg||'?'}kg×${r.reps||'?'}${r.rpe?' RPE'+r.rpe:''}`).join(', ');return `${ex?.[0]||'Exercice '+(i+1)} : ${vals} (repos choisi ${data.restPrefs[id+'|'+i]??ex?.[5]??'?'} s)`}).filter(Boolean).join('; ')}else if(v.push){details='Pompes : '+v.push.join('/')}else if(id.startsWith('bike')){details=`BikeErg : ${v.minutes||'?'} min, ${v.watts||'?'} W, ${v.distance||'?'} m, ${v.rpm||'?'} RPM, RPE ${v.effort||'?'}/10`}else{details='Activités cochées : '+(v.checks?.filter(Boolean).length||0)}return `${d} — ${s?.name||id} [${status}]\n${details}\nRPE séance ${v.sessionRpe||'?'} ; fatigue ${v.fatigue||'?'} ; douleur genou ${v.knee??'?'} ; douleur bras ${v.arm??'?'} ; notes : ${v.notes||'aucune'}`}
function copyText(t){const fallback=()=>{const a=document.createElement('textarea');a.value=t;document.body.append(a);a.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}a.remove();if(ok)alert('Bilan copié. Colle-le dans ChatGPT.');else prompt('Sélectionne et copie ce bilan :',t)};if(navigator.clipboard?.writeText)navigator.clipboard.writeText(t).then(()=>alert('Bilan copié. Colle-le dans ChatGPT.'),fallback);else fallback()}
function buildCoachReport(){const from=plus(todayISO(),-55);const keys=Object.keys(data.entries).filter(k=>k.slice(0,10)>=from).sort();const program=Object.keys(EX).map(id=>id.toUpperCase()+' : '+activeEx(id).map(x=>`${x[0]} ${x[2]}×${x[4]} à ${x[3]||'?'}kg, repos ${x[5]}s`).join(' ; ')).join('\n');return `DOSSIER MON TRAINING — Ajustement de cycle\nDébut du cycle : ${data.cycleStart}\nPROGRAMME ACTUEL\n${program}\nHISTORIQUE 8 SEMAINES\n${keys.map(k=>formatEntry(k,data.entries[k])).join('\n')||'Aucune séance enregistrée'}\nMerci d'analyser la progression et de proposer si nécessaire un fichier JSON de modification compatible Mon Training V5. Ne modifie pas les exercices de rééducation sans prudence.`}
function progressProposal(key){const [id,iRaw]=key.split('|'),i=+iRaw,ex=currentEx(id,i);if(!ex)return null;const finished=Object.entries(data.entries).filter(([k,v])=>k.endsWith('|'+id)&&v.done&&v.sets?.[i]?.length).sort((a,b)=>a[0].localeCompare(b[0]));if(!finished.length)return null;const [k,v]=finished.at(-1);const rows=v.sets[i],rpe=Number(rows.at(-1)?.rpe),knee=Number(v.knee||0),arm=Number(v.arm||0),target=Number(ex[4]),sets=Number(ex[2]);if(rows.length<sets||!Number.isFinite(rpe)||!rpe||knee>=3||arm>=3||rpe>8||rows.slice(0,sets).some(r=>Number(r.reps)<target))return null;const next=target>=12?{kg:(Number(ex[3])||0)+((id==='push'&&i===0)?2.5:1),reps:Math.max(8,target-2)}:{kg:ex[3],reps:target+1};if(!Number(ex[3])||next.kg===0)return null;const override={name:ex[0],description:ex[1],sets:ex[2],kg:next.kg,reps:next.reps,rest:ex[5]};return {override,description:`${ex[0]} : ${ex[3]} kg × ${ex[2]}×${target} → ${next.kg} kg × ${ex[2]}×${next.reps}`,date:k.slice(0,10)}}
function renderSuggestions(){const candidates=Object.keys(EX).flatMap(id=>EX[id].map((_,i)=>({key:id+'|'+i,p:progressProposal(id+'|'+i)}))).filter(x=>x.p&&data.progressDecisions[x.key]?.date!==todayISO());const elapsed=Math.floor((new Date(todayISO()+'T12:00:00')-new Date(data.cycleStart+'T12:00:00'))/86400000);return `<div class="card suggestion"><h3>Progression guidée</h3><p class="mini">Propositions basées sur les dernières séries renseignées : toutes les répétitions atteintes, RPE final ≤ 8 et douleurs inférieures à 3/10. Validation obligatoire. Ce sont des règles simples, pas une analyse médicale.</p>${candidates.slice(0,5).map(x=>`<div class="exercise"><b>${esc(x.p.description)}</b><p class="mini">Dernière séance : ${x.p.date}</p><div class="actions"><button class="primary" data-accept-progress="${x.key}">Accepter</button><button data-reject-progress="${x.key}">Plus tard</button></div></div>`).join('')||'<p class="mini">Aucune nouvelle progression à proposer pour le moment.</p>'}${elapsed>=42?'<p class="notice">Cycle de 6 à 8 semaines : prépare un bilan ChatGPT dans l’onglet Données avant de changer tes exercices.</p>':''}</div>`}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===view));document.querySelector('#app').innerHTML=header()+(openId?renderSession():view==='today'?renderToday():view==='week'?renderWeek():view==='progress'?renderProgress():view==='lexicon'?renderLexicon():renderSettings())}function capture(){const s=sessions.find(x=>x.id===openId),v=structuredClone(get(s.id,date));document.querySelectorAll('[data-field]').forEach(el=>{const path=el.dataset.field.split('.');let obj=v;while(path.length>1){const p=path.shift();obj[p]??=p==='sets'||p==='push'?[]:{};obj=obj[p]}obj[path[0]]=el.value});document.querySelectorAll('[data-check]').forEach(el=>{v.checks??=[];v.checks[+el.dataset.check]=el.checked});return v}
let timerEnd=0,timerInterval;function startTimer(sec){timerEnd=Date.now()+sec*1000;clearInterval(timerInterval);const tick=()=>{let left=Math.max(0,Math.ceil((timerEnd-Date.now())/1000));const e=document.querySelector('#timer');e.classList.add('show');e.innerHTML=`<b>⏱ ${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b><button data-addtime="-30">−30 s</button><button data-addtime="30">+30 s</button><button data-stoptimer="1">Fermer</button>`;if(!left)clearInterval(timerInterval)};tick();timerInterval=setInterval(tick,500)}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){view=b.dataset.tab;openId=null;render();return}if(b.dataset.date){date=b.dataset.date;view='today';openId=null;render();return}if(b.dataset.shift){date=plus(date,+b.dataset.shift);render();return}if(b.dataset.open){openId=b.dataset.open;render();scrollTo(0,0);return}if(b.dataset.back){openId=null;render();return}if(b.dataset.timer){startTimer(+b.dataset.timer);return}if(b.dataset.addtime){timerEnd=Math.max(Date.now(),timerEnd+(+b.dataset.addtime)*1000);return}if(b.dataset.stoptimer){clearInterval(timerInterval);document.querySelector('#timer').classList.remove('show');return}if(b.dataset.save){let v=capture();v.done=true;v.updatedAt=new Date().toISOString();set(openId,date,v);openId=null;render();scrollTo(0,0);return}if(b.dataset.unfinish){let v=capture();v.done=false;set(openId,date,v);openId=null;render();return}if(b.dataset.history){const [d,id]=b.dataset.history.split('|');date=d;openId=id;render();return}if(b.id==='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([exportJSON()],{type:'application/json'}));a.download='mon-training-'+todayISO()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000);return}if(b.id==='copySession'){const selected=document.querySelector('#sessionDate')?.value;const keys=Object.keys(data.entries).filter(k=>k.startsWith(selected+'|'));if(!keys.length){alert('Aucune séance enregistrée à cette date.');return}copyText('Bilan Mon Training — '+selected+'\n'+keys.map(k=>formatEntry(k,data.entries[k])).join('\n'));return}
if(b.id==='copyHistory'){const from=document.querySelector('#fromDate')?.value,to=document.querySelector('#toDate')?.value;if(!from||!to||from>to){alert('Choisis une période valide.');return}const keys=Object.keys(data.entries).filter(k=>k.slice(0,10)>=from&&k.slice(0,10)<=to).sort();if(!keys.length){alert('Aucune séance enregistrée sur cette période.');return}const finished=keys.filter(k=>data.entries[k].done);const summary=`${keys.length} séances (${finished.length} terminées) • ${new Set(keys.map(k=>k.slice(0,10))).size} jours d’entraînement.`;copyText('Historique Mon Training du '+from+' au '+to+'\n'+summary+'\n'+keys.map(k=>formatEntry(k,data.entries[k])).join('\n'));return}
if(b.dataset.range){const to=todayISO(),from=plus(to,b.dataset.range==='7'?-6:-29);document.querySelector('#fromDate').value=from;document.querySelector('#toDate').value=to;return}
if(b.id==='coachExport'){copyText(buildCoachReport());return}
if(b.dataset.acceptProgress){const key=b.dataset.acceptProgress, proposal=progressProposal(key);if(!proposal)return;const prev=data.programOverrides[key]||null;data.programHistory.push({at:new Date().toISOString(),type:'progression',key,previous:prev});data.programOverrides[key]={...proposal.override};data.progressDecisions[key]={date:todayISO(),status:'accepted'};persist();render();return}
if(b.dataset.rejectProgress){data.progressDecisions[b.dataset.rejectProgress]={date:todayISO(),status:'rejected'};persist();render();return}
if(b.id==='importCoach'){const input=document.querySelector('#coachFile');if(input)input.click();return}
if(b.id==='undoCoach'){const last=data.programHistory.pop();if(!last){alert('Aucune modification à annuler.');return}if(last.type==='coach-batch'){data.programOverrides=last.previous;data.cycleStart=last.previousCycleStart||data.cycleStart}else if(last.key){if(last.previous)data.programOverrides[last.key]=last.previous;else delete data.programOverrides[last.key]}persist();render();return}
if(b.dataset.videoSave){const name=b.dataset.videoSave;const input=[...document.querySelectorAll('[data-video-input]')].find(x=>x.dataset.videoInput===name);const url=(input?.value||'').trim();if(url && !/^https:\/\/(www\.)?(youtube\.com\/watch\?v=[a-zA-Z0-9_-]{11}|youtu\.be\/[a-zA-Z0-9_-]{11})(?:[&#?].*)?$/.test(url)){alert('Colle un lien direct vers une vidéo YouTube.');return}data.videoPrefs ||= {};data.videoPrefs[name]=url;persist();render();return}if(b.id==='clear'&&confirm('Effacer définitivement toutes les séances enregistrées sur cet appareil ?')){data.entries={};persist();render()}});document.addEventListener('input',e=>{if(e.target.id==='lexSearch')document.querySelector('#lexItems').innerHTML=lexItems(e.target.value)});document.addEventListener('change',async e=>{if(e.target.dataset.restpref){const val=Number(e.target.value);if(!Number.isFinite(val)||val<0||val>1200){alert('Choisis une durée entre 0 et 1200 secondes.');return}data.restPrefs[e.target.dataset.restpref]=val;persist();const btn=e.target.closest('.exercise')?.querySelector('[data-timer]');if(btn)btn.dataset.timer=val;return}if(e.target.id==='coachFile'){try{const file=e.target.files?.[0];if(!file)return;const r=JSON.parse(await file.text());if(r.format!=='mon-training-coach-v5'||!Array.isArray(r.changes))throw Error('Format attendu : mon-training-coach-v5 et changes[]');if(!r.changes.length||r.changes.length>40)throw Error('Nombre de modifications invalide');const proposed={...data.programOverrides};const preview=[];for(const c of r.changes){if(!['push','pull','legs'].includes(c.session)||!Number.isInteger(c.index)||c.index<0||c.index>=EX[c.session].length)throw Error('Exercice inconnu : '+JSON.stringify(c));const key=c.session+'|'+c.index,base=currentEx(c.session,c.index);const vals={name:String(c.name||base[0]).slice(0,100),description:String(c.description||base[1]).slice(0,180),sets:Number(c.sets??base[2]),kg:Number(c.kg??base[3]),reps:Number(c.reps??base[4]),rest:Number(c.rest??base[5])};if(![vals.sets,vals.kg,vals.reps,vals.rest].every(Number.isFinite)||vals.sets<1||vals.sets>10||vals.kg<0||vals.kg>400||vals.reps<1||vals.reps>100||vals.rest<0||vals.rest>1200)throw Error('Valeur hors limite : '+key);proposed[key]=vals;preview.push(`${base[0]} → ${vals.name} : ${vals.sets}×${vals.reps} à ${vals.kg} kg, repos ${vals.rest} s`)}if(confirm('Appliquer ces modifications ?\n\n'+preview.join('\n')+'\n\nL’ancien programme reste récupérable.')){data.programHistory.push({at:new Date().toISOString(),type:'coach-batch',previous:{...data.programOverrides},previousCycleStart:data.cycleStart});data.programOverrides=proposed;if(r.newCycle===true)data.cycleStart=todayISO();persist();render()}}catch(err){alert('Import impossible : '+err.message)}return}if(e.target.id!=='import')return;try{const r=JSON.parse(await e.target.files[0].text());if(!r.entries||typeof r.entries!=='object')throw Error('Format non reconnu');if(confirm('Remplacer les résultats actuels par cette sauvegarde ?')){data={entries:r.entries,restPrefs:r.restPrefs||{},baseline:r.baseline||data.baseline,programOverrides:r.programOverrides||{},programHistory:r.programHistory||[],progressDecisions:r.progressDecisions||{},likes:r.likes||{},videoPrefs:r.videoPrefs||{},cycleStart:r.cycleStart||'2026-10-12'};persist();render()}}catch(err){alert('Impossible d’importer : '+err.message)}});render();
</script><script>if('serviceWorker' in navigator && location.protocol==='https:'){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
